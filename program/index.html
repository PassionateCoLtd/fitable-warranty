<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fafafa">
  <meta name="description" content="내 기구에서 시작하는 운동 습관. 핏에이블 제품 등록과 운동 기록을 한곳에서.">
  <title>핏에이블 · 오늘의 움직임</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a href="#main" class="skip-link">본문으로 이동</a>
  <header class="header"><a href="./" class="brand" aria-label="핏에이블 첫 화면">FITABLE</a><div class="header-right"><span class="pilot">MOVEMENT JOURNAL</span><button id="account-button" class="account-button" type="button">회원 연결</button></div></header>
  <div id="mode-banner" class="mode-banner" hidden></div>
  <main id="main" tabindex="-1"><div class="loading-state" role="status">오늘의 움직임을 준비하고 있어요<span class="loading-dot"></span></div></main>
  <nav class="bottom-nav" aria-label="주요 메뉴" hidden>
    <button type="button" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg><span>오늘</span></button>
    <button type="button" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6M2 20h20"/></svg><span>내 기록</span></button>
    <button type="button" data-tab="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 3-9 11h7l-1 7 10-12h-8z"/></svg><span>다음 운동</span></button>
    <button type="button" data-tab="gear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18M6 8v12M18 8v12M3 4v8M21 4v8M9 4h6"/></svg><span>내 기구</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="registration-dialog" class="modal"><div class="modal-heading"><div><p class="eyebrow">MY FITABLE</p><h2>내 기구 등록</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="등록 창 닫기">×</button></div><p id="registration-description" class="muted"></p><form id="registration-form"><label>제품<select name="product_id" required></select></label><label>구매처<select name="channel" required><option value="">구매처를 선택해 주세요</option><option value="cafe24">핏에이블 자사몰</option><option value="naver">네이버 스마트스토어</option><option value="coupang">쿠팡</option><option value="other">기타 공식 판매처</option></select></label><label>주문번호<input name="order_no" maxlength="60" autocomplete="off" required placeholder="구매 내역에 표시된 주문번호"></label><label>구매일<input name="purchased_at" type="date" min="2000-01-01" required></label><p class="form-note">등록 요청 후 구매 내역을 확인합니다. 등록만으로 보증 연장이나 구매 인증이 완료되지는 않습니다.</p><p id="registration-error" class="form-error" role="alert"></p><button type="submit" class="button primary full">등록 요청하기 <span aria-hidden="true">↗</span></button></form></dialog>
  <dialog id="account-dialog" class="modal"><div class="modal-heading"><h2>나의 핏에이블</h2><button type="button" class="icon-button" data-close-dialog aria-label="회원 창 닫기">×</button></div><div id="account-content"></div></dialog>
  <noscript><div class="noscript">이 페이지는 운동 기록을 위해 자바스크립트가 필요합니다.</div></noscript>
</body>
</html>
